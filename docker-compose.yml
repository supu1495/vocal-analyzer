# ログローテーション共通設定: 1ファイル最大10MB × 3世代まで保持し、それ以上は古いものから削除
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./backend:/app
      - vocal_uploads:/tmp/vocal_analyzer
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - INVITE_CODE=${INVITE_CODE}
      - DAILY_UPLOAD_LIMIT=${DAILY_UPLOAD_LIMIT:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  celery_worker:
    build:
      context: ./backend
    # 分析は1件ずつ処理する。プロセスごとに Demucs と Crepe を読み込むため、
    # 未指定（CPU コア数ぶん）だと同時に複数来たときにメモリが足りなくなる
    command: celery -A celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend:/app
      - vocal_uploads:/tmp/vocal_analyzer
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7
    # パスワードなしでは読み書きできないようにする（ロックアウト回数・タスクキューの改ざん対策）
    # --appendonly yes: 書き込みのたびにファイル（/data/appendonlydir）へ追記し、作り直しや停止のあとも
    # ログアウト済みトークン・ログイン制限の回数・task の持ち主が消えないようにする
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    environment:
      # redis-cli はこの環境変数からパスワードを読む（-a で渡すと警告が出るため）
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    # restart は付けない。ホストの Apache などが 80 番を使っていると起動に失敗し、再起動を繰り返すため
    # 本番は cloudflared → backend で直接つながっており、nginx が止まっていても影響しない
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    # 本番（デスクトップ）だけで動かす。本番の .env にだけ COMPOSE_PROFILES=prod を書く
    # 開発用のノートPCで起動すると、同じトンネルにつながって本番のリクエストを受けてしまうため
    profiles: ["prod"]
    restart: unless-stopped
    # backend の準備ができてからトンネルを開き、起動直後の 502 を防ぐ
    # ただし docker compose up のときだけ効く。PC 再起動後の自動起動（restart）では Docker 本体が
    # depends_on を見ないため、backend より先に起動して一時的に 502 になることがある
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  vocal_uploads:
  redis_data: